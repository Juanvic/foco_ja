<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" width="48" height="46">
  <defs>
    <linearGradient id="focoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Fundo do Favicon -->
  <rect width="48" height="46" rx="10" fill="#0F172A" />

  <!-- Retículos da Mira (Foco) -->
  <line x1="24" y1="5" x2="24" y2="8" stroke="url(#focoGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="40" y1="23" x2="43" y2="23" stroke="url(#focoGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="24" y1="38" x2="24" y2="41" stroke="url(#focoGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="5" y1="23" x2="8" y2="23" stroke="url(#focoGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Anel Guia Pontilhado -->
  <circle cx="24" cy="23" r="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-dasharray="2 2.5" opacity="0.8" />

  <!-- Caixas de Seleção / Checkbox -->
  <rect x="14" y="13" width="20" height="20" rx="4.5" fill="none" stroke="url(#focoGrad)" stroke-width="2.5" />

  <!-- Checkmark (✔) -->
  <path d="M 18.5 23 L 22 26.5 L 29.5 18.5" 
        fill="none" 
        stroke="url(#focoGrad)" 
        stroke-width="2.8" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
