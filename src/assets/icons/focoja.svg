<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradiente Principal (Foco e Progresso) -->
    <linearGradient id="focoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Sombreamento Suave do Ícone -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#06B6D4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Fundo do App / Ícone (Arredondado e Escuro) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#0F172A" />

  <!-- GRUPO DO LOGO -->
  <g filter="url(#glow)">
    
    <!-- 1. ELEMENTO FOCO: Retículos / Mira (Top, Right, Bottom, Left) -->
    <line x1="256" y1="96" x2="256" y2="124" stroke="url(#focoGradient)" stroke-width="8" stroke-linecap="round" />
    <line x1="388" y1="256" x2="416" y2="256" stroke="url(#focoGradient)" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="388" x2="256" y2="416" stroke="url(#focoGradient)" stroke-width="8" stroke-linecap="round" />
    <line x1="96" y1="256" x2="124" y2="256" stroke="url(#focoGradient)" stroke-width="8" stroke-linecap="round" />

    <!-- 2. ELEMENTO MIRA/TARGET: Anel de Concentração sutil em volta -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="8 12" opacity="0.6" />

    <!-- 3. ELEMENTO TO-DO: Quadrado Checkbox com cantos suaves -->
    <rect x="144" y="144" width="224" height="224" rx="48" fill="none" stroke="url(#focoGradient)" stroke-width="14" />

    <!-- 4. ELEMENTO CONCLUSÃO: Checkmark Centralizado (✔) -->
    <path d="M 200 256 L 240 296 L 316 216" 
          fill="none" 
          stroke="url(#focoGradient)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
          
  </g>
</svg>
